name: Android TWA build

# Builds the signed .aab (Play Store) and .apk (sideload/testing) for the
# Trusted Web Activity wrapper in android/. Manual only — this isn't part of
# the web app's deploy loop, it's a separate, infrequent release artifact.
# Needs three repo secrets set up first (see android/README.md):
#   ANDROID_KEYSTORE_BASE64  - `base64 -w0 android.keystore`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore
          echo "decoded keystore sha256:"
          sha256sum android.keystore

      - name: Point bubblewrap at this runner's JDK/Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # bubblewrap only looks for sdkmanager at <sdk>/tools/bin/sdkmanager
          # or <sdk>/bin/sdkmanager (both legacy layouts); GitHub-hosted
          # runners only ship the modern <sdk>/cmdline-tools/latest/bin/,
          # which fails bubblewrap's SDK validity check even though the SDK
          # itself is perfectly usable. A symlink at the legacy fallback
          # path satisfies both that check and bubblewrap's own
          # `installBuildTools()` invocation.
          mkdir -p "$ANDROID_HOME/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/bin/sdkmanager"
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath":"${JAVA_HOME}","androidSdkPath":"${ANDROID_HOME}"}
          EOF

      # bubblewrap installs build-tools;34.0.0 on demand if this runner's
      # preinstalled SDK doesn't already have that exact version; that
      # install step needs licenses pre-accepted or it hangs on a prompt.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # Fails fast (before the ~90s gradle build) with a clear error if the
      # password secrets don't match this keystore, instead of only finding
      # out at the final apksigner step. Never prints the secret itself —
      # only its length, which is enough to catch a stray newline/prefix
      # from a copy-paste mistake without leaking the value.
      - name: Verify keystore password secrets
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "ANDROID_KEYSTORE_PASSWORD length: $(printf '%s' "$BUBBLEWRAP_KEYSTORE_PASSWORD" | wc -c)"
          echo "ANDROID_KEY_PASSWORD length: $(printf '%s' "$BUBBLEWRAP_KEY_PASSWORD" | wc -c)"
          "$JAVA_HOME/bin/keytool" -list -keystore android.keystore -alias android \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD"

      # bubblewrap prompts "There are changes in twa-manifest.json. Would you
      # like to apply them to the project before building? (Y/n)" whenever
      # twa-manifest.json's checksum drifts from android/manifest-checksum.txt
      # (e.g. bumping appVersionCode) — with no TTY on the runner that prompt
      # just kills the process (exit 130). We must answer "n": "Y" makes
      # bubblewrap regenerate AndroidManifest.xml from twa-manifest.json,
      # which would silently drop the hand-added
      # `tools:node="remove"` line that strips ACCESS_FINE_LOCATION (see the
      # comment on that line in AndroidManifest.xml). Piped as `printf 'n\n' |`
      # rather than `yes n |` so only this one known prompt is answered —
      # `yes` would blindly answer "n" to any other prompt bubblewrap might
      # ever add, silently changing its meaning.
      - name: bubblewrap build (gradle bundleRelease/assembleRelease + sign)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: printf 'n\n' | npx --yes @bubblewrap/cli build

      # Reads the *actual signed APK's* merged manifest, not the manifest
      # source — catches the real failure mode this project has hit before:
      # AndroidManifest.xml's `tools:node="remove"` on ACCESS_FINE_LOCATION
      # (see that file) getting silently lost in a future Gradle/manifest-
      # merger change, or overridden by androidbrowserhelper's own manifest
      # merging in a later dependency bump. Runs on every build instead of
      # relying on someone remembering to dump the manifest by hand before
      # each Play Store upload (작업지시서 2026-08-26 "AAB 매니페스트 검증 +
      # 출시 절차"). The full permission dump also becomes this build's
      # source-of-truth log for the Play Console data-safety questionnaire.
      - name: Verify final manifest (permissions, package, versions)
        run: |
          APK="app-release-signed.apk"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 | sort -V | tail -1)"
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2를 build-tools 아래에서 찾지 못했습니다"
            exit 1
          fi
          echo "using aapt2: $AAPT2"
          echo
          echo "== aapt2 dump badging (package / versionCode / targetSdk) =="
          "$AAPT2" dump badging "$APK" | tee badging.txt
          echo
          echo "== aapt2 dump permissions (전체 권한 목록 — 데이터 세이프티 설문 대조용) =="
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          echo
          if grep -q 'android.permission.ACCESS_FINE_LOCATION' permissions.txt; then
            echo "::error::ACCESS_FINE_LOCATION이 최종 서명된 APK에 남아 있습니다 — AndroidManifest.xml의 tools:node=\"remove\"가 유실됐을 가능성이 큽니다. Play 데이터 세이프티 신고 전 반드시 원인을 확인하세요."
            exit 1
          fi
          echo "ACCESS_FINE_LOCATION 없음 — 확인 완료"

      - uses: actions/upload-artifact@v4
        with:
          name: tradule-android-release
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 30

      - name: Remove keystore from the runner's disk
        if: always()
        run: rm -f android.keystore
