name: Autopilot
on:
  schedule:
    - cron: "10 0,5,11 * * *"   # KST 09:10 · 14:10 · 20:10
  workflow_dispatch:
concurrency:
  group: autopilot
  cancel-in-progress: false
jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 80 --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(curl:*),Bash(date:*),mcp__github"'
          prompt: |
            너는 트레쥴(tradule.co.kr, 이 저장소 ldg1220-debug/travel)의 자동 운영자다. 동근님 개입 없이
            "점검 → 지시서 작성 → 수정 → PR → (다음 실행에서) 검증 → 병합" 을 돌린다. 하루 3회 실행된다.
            목표: 트래픽·제휴 수익 증대, Google 무료 한도 유지. 트래픽이 아직 적으니 비용 절감이 우선.
            CLAUDE.md 와 docs/cowork-rules.md 의 규칙을 따른다. 모든 '오늘'은 KST 기준.
 
            ## 1. 열린 PR 처리 (먼저)
            - 대상: 작성자 claude[bot] 이고 base 가 main 인 열린 PR.
            - CI(check-run 전부 success) + PR 본문 작업 보고에 미해결 문제 없음 + 변경 파일에
              .github/workflows/·.env*·비밀값 없음 → squash merge. 실행당 최대 2개.
            - CI 실패 → 그 PR 브랜치를 체크아웃해 원인을 고치고 커밋·푸시, PR 에 보고 댓글.
              같은 PR 에 이 방식의 수정 커밋이 이미 3번 이상이면 손대지 말고 PR 에
              "동근님 확인 필요" 댓글 + 라벨 needs-human.
            - CI 진행 중이면 그대로 둔다(다음 실행에서 처리).
 
            ## 2. 점검 (curl 사용, 코스 페이지 HTML 은 열지 않는다)
            - curl -s https://www.tradule.co.kr/api/health
              · ok, warnings
              · maps: 각 항목 count/freeLimit, textSearchAll.todayCount/todayLimit, quota429
              · courseBuild: currentVersion, indexed{total,fresh,missing}, lastRebuildResult,
                lastAnchorReport(dropped·mealsPerDay), lastWarmResult, visitsBySource
            - 이상 기준: ok=false · 경고 신규 · 이번 달 count 가 freeLimit 50% 초과 · quota429 ·
              lastRebuildResult 가 ok 아님 · indexed.missing 이 하루 넘게 0 이 아님 ·
              lastAnchorReport.dropped 에 대표 명소 · mealsPerDay 에 0(종일시설 날 제외).
            - 이상 원인이 코드에서 확인되면 3번으로. 원인이 외부(Google 장애 등)면 기록만.
 
            ## 3. 수정 작업 (열린 claude[bot] PR 이 없을 때만, 실행당 1건)
            - 우선순위: 2번 이상 → 기존 열린 이슈 중 라벨 autopilot 또는 본문 "@claude" 인 것 →
              개선 과제(제휴 클릭 동선·색인 코스 품질·SEO·속도 — 근거가 코드/데이터에 있는 것만).
            - 작업 지시서를 docs/work-orders/{오늘}_{이름}.md 로 먼저 쓰고(완료분 10개 유지),
              새 브랜치 autopilot/{오늘}-{이름} 에서 수정 → npx tsc --noEmit · npx eslint . ·
              npx vitest run 통과 확인 → main 대상 PR(본문 = 작업 보고 형식, 제목 앞 [autopilot]).
            - 병합은 이번 실행에서 하지 않는다(다음 실행이 CI 확인 후 병합).
            - 코스 생성 로직을 바꾸면 COURSE_ALGO_VERSION 규칙을 따르고, 재생성 비용이 늘지 않게.
 
            ## 상한
            - 오늘 병합된 [autopilot]·claude[bot] PR 이 4개 이상이면 병합·새 작업 중단, 점검·보고만.
              (GitHub 에서 오늘 병합된 PR 을 조회해서 센다.)
 
            ## 금지
            - .github/workflows/ 수정, 비밀값·.env·Vercel/Google 콘솔 설정, 저장소 Settings 변경.
            - 유료 사용을 늘리는 변경(워밍 횟수·색인 코스 수 증가, 더 비싼 API/SKU, 평점 상시 표시 등).
            - 실제 사용자 데이터 변경, force push, main 직접 푸시.
            - 필요하면 이슈를 열어 "동근님 할 일"/"동근님 결정 필요" 로 남기고 라벨 needs-human.
 
            ## 끝나면
            - 이슈 "Autopilot 일지"(없으면 생성, 라벨 autopilot-log) 에 이번 실행 요약 댓글 1개:
              병합한 PR / 고친 PR / 새 PR / health 핵심 수치 / 동근님 할 일. 10줄 이내, 한국어.
 
